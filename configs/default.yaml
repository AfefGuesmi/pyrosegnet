seed: 42

data:
  raw_dir: "data/raw"
  hdf5_file: "data/raw/512x512.hdf5"
  processed_dir: "data/processed"

dataset:
  name: "CaBuAr"
  n_bands: 12
  patch_size: 512
  band_names: ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B11", "B12"]
  band_indices:
    red: 3
    nir: 7
    swir1: 10
    swir2: 11

splits:
  train_folds: [0, 1, 2]
  val_folds: [3]
  test_folds: [4]

threshold:
  dnbr_range: [0.05, 0.55]
  dnbr_step: 0.01

random_forest:
  n_estimators: 200
  max_depth: 25
  max_samples_per_class: 100000

training:
  img_size: 256
  batch_size: 4
  num_epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  patience: 7
  num_workers: 0
  pos_weight: 3.0

outputs:
  checkpoint_dir: "outputs/checkpoints"
  prediction_dir: "outputs/predictions"
  figure_dir: "outputs/figures"
  result_dir: "outputs/results"
